<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8"/>

<head>
    <title>Вход</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}">
</head>

<body>
<form th:action="${'/login'}" method="post">
    <table style="width:30%;margin-left:auto;margin-right:auto;border-radius:2%;padding:10px;background-color:whitesmoke;">
        <tr>
            <td colspan="2" style="text-align:center;">
                <h2>Вход в аккаунт</h2>
            </td>
        </tr>
        <!-- Сообщение об ошибке входа (например, от Spring Security) -->
        <tr th:if="${error}">
            <td style="color:red;font-weight:bold;" colspan="2">Неверный логин или пароль.</td>
        </tr>
        <!-- Сообщение об успешном выходе (например, от Spring Security) -->
        <tr th:if="${logout}">
            <td style="color:green;font-weight:bold;" colspan="2">Вы успешно вышли из системы.</td>
        </tr>
        <tr th:if="${deleted}">
            <td style="color:green;font-weight:bold;" colspan="2">Аккаунт успешно удалён.</td>
        </tr>
        <!-- Общие ошибки, если они передаются через модель -->
        <tr th:each="error : ${errors}">
            <td style="color:red;" th:text="${error}" colspan="2"/>
        </tr>
        <tr>
            <td style="font-weight:bold;">Логин</td>
            <td>
                <input name="username" type="text" th:value="${username}" style="width:100%" required/>
            </td>
        </tr>
        <tr>
            <td style="font-weight:bold;">Пароль</td>
            <td>
                <input name="password" type="password" style="width:100%" required/>
            </td>
        </tr>
        <tr>
            <td style="text-align:right" colspan="2">
                <button type="submit">Войти</button>
            </td>
        </tr>
    </table>
</form>

<p style="text-align:center; margin-top: 15px;">
    Ещё нет аккаунта? <a th:href="@{/signup}">Зарегистрироваться</a>
</p>

</body>
</html>
