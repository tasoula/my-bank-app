<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Банк</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}">
</head>

<body>
<a href="/logout" style="float:right;">
    <b>ВЫЙТИ &cudarrr;</b>
</a>

<table style="width:70%;margin-left:auto;margin-right:auto; margin-top: 20px;">
    <tr><td style="padding:5px;">
        <form method="post" th:action="@{/user/editUser}">
            <table class="section-table">
                <tr>
                    <td colspan="3" class="section-header">Данные пользователя</td>
                </tr>
                <tr>
                    <td style="font-weight:bold; width: 20%;">Логин</td>
                    <td colspan="2" th:text="${login}"/>
                </tr>
                <tr th:if="${userAccountErrors!=null}" th:each="userAccountError : ${userAccountErrors}">
                    <td style="color:red;" th:text="${userAccountError}"/>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Фамилия Имя</td>
                    <td th:text="${name}"/>
                    <td>
                        <input name="name" type="text" style="width:100%"/>
                    </td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">email</td>
                    <td th:text="${email}"/>
                    <td>
                        <input name="email" type="text" style="width:100%"/>
                    </td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Дата рождения</td>
                    <td th:text="${birthdate}"/>
                    <td>
                        <input name="birthdate" type="date" style="width:100%"/>
                    </td>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Сумма на счете</td>
                    <td colspan="2" th:text="${balance}"/>
                </tr>
                <tr>
                    <td style="text-align:right" colspan="3">
                        <button type="submit">Сохранить изменения</button>
                    </td>
                </tr>
            </table>
        </form>
    </td></tr>
    <tr><td style="padding:5px;">
        <form method="post" th:action="${'/user/cash'}">
            <table class="section-table">
                <tr>
                    <td colspan="4" class="section-header">Наличные операции</td>
                </tr>
                <tr th:if="${cashErrors!=null}" th:each="cashError : ${cashErrors}">
                    <td colspan="4" class="error" th:text="${cashError}"/>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Сумма</td>
                    <td>
                        <input name="amount" type="number" step="0.01" min="0.01" style="width:100%" required placeholder="Введите сумму"/>
                    </td>
                    <td style="text-align:right" colspan="2">
                        <button name="action" value="DEPOSIT">Положить</button>
                        <button name="action" value="WITHDRAW">Снять</button>
                    </td>
                </tr>
            </table>
        </form>
    </td></tr>


    <tr><td style="padding:5px;">
        <form method="post" th:action="${'/user/transfer/other'}">
            <table class="section-table">
                <tr>
                    <td colspan="4" class="section-header">Перевод другому пользователю</td>
                </tr>
                <tr th:if="${transferOtherErrors!=null}" th:each="transferOtherError : ${transferOtherErrors}">
                    <td colspan="4" class="error" th:text="${transferOtherError}"/>
                </tr>
                <tr>
                    <td style="font-weight:bold;">Кому</td>
                    <td>
                        <select name="to_login" required>
                            <option value="">Выберите пользователя</option>
                            <option th:each="user : ${users}" th:value="${user.getLogin()}" th:text="${user.getName() + ' (' + user.getLogin() + ')'}"/>
                        </select>
                    </td>
                    <td style="font-weight:bold;">Сумма</td>
                    <td>
                        <input name="amount" type="number" step="0.01" min="0.01" required placeholder="Введите сумму"/>
                    </td>
                </tr>
                <tr>
                 <!--   <td style="font-weight:bold;">Комментарий</td>
                    <td colspan="2">
                        <input name="memo" type="text" placeholder="Необязательный комментарий"/>
                    </td> -->
                    <td style="text-align:right">
                        <button>Перевести</button>
                    </td>
                </tr>
            </table>
        </form>
    </td></tr>
</table>
</body>
</html>
