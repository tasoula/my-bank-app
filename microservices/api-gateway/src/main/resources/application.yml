server:
  port: ${GATEWAY_PORT}
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_ISSUER_HOST_AND_PORT:localhost:8082}/realms/master
  config.import: "consul:"
  cloud:
    consul:
      host: localhost          # ????? Consul (?? ????????? localhost)
      port: 8500               # ???? Consul (8500 ?? ?????????)
      discovery:
        service-name: api-gateway  # ?????????????, ?? ????????? ??????? spring.application.name
        ip-address: 127.0.0.1
        prefer-ip-address: true
      config:
        enabled: true            # ???????? Consul Config ??? ??????? ????????????
        prefix: config           # ??????? ? KV-????????? Consul (?? ????????? "config")
        defaultContext: application  # ???????? ?? ?????????
    #discovery:
    #  client:
    #    simple:
    #      instances:
    #        accounts-service: # ?? ?? ?????????? Service Discovery, ??????? ?????????? ????? ??????????????
    #          - uri: http://127.0.0.1:${ACCOUNTS_PORT} #???? ????????? ??, ??? ??? ?????? ???? ???? (??? ?????) ???????? accounts service
    gateway:
      routes:
        - id: accounts-route  # ID ?????
          uri: lb://accounts-service  # URI ????????????, ?? ??????? ??????? ?????????????? ??????
          predicates:
            - Path=/accounts/** # URI ???????????? ? Gateway ???????, ? ??????? ???????? ????
          filters:
            - RewritePath=/accounts/?(?<segment>.*), /$\{segment} # ??????, ??????? ???????????? ?????? ? ???????? ??????? (????????? ??? ??????? ? ??????)
            - TokenRelay= # ??? ???????? ??????
