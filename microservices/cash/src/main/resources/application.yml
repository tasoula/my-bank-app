spring:
  application:
    name: cash

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.issuer-uri}

  config.import: "consul:"
  cloud:
    consul:
      host: ${CONSUL_HOST}
      port: ${CONSUL_PORT}
      discovery:
        service-name: cash
        ip-address: ${app.ip-address}
        prefer-ip-address: true
      config:
        enabled: true
        prefix: config
        defaultContext: application
        format: YAML
